name: Host capability checks

on:
  push:
    branches: [main, feat/workflow-host-capabilities]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # package.json requires an exact npm 11.19.0; setup-node's bundled 11.19.1 fails devEngines.
      - name: Install pinned npm
        run: cd "$RUNNER_TEMP" && npm install -g npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check

      # On style failure, print formatted file contents as bounded base64 chunks
      # so maintainers can apply the exact project formatter output.
      - name: Capture formatter output
        if: failure()
        run: |
          ./node_modules/.bin/vp check --fix
          git diff --name-only -z | while IFS= read -r -d '' file; do
            printf 'FORMAT_FILE_BEGIN:%s\n' "$file"
            base64 -w0 "$file" | fold -w 2048
            printf 'FORMAT_FILE_END:%s\n' "$file"
          done
